[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stocksense-common"
version = "0.1.0"
description = "StockSense common python library with structured logging, middleware, and errors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "starlette>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*"]
